<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Secure Chat interface preview mockup</title>
  <desc id="desc">Illustrative mockup showing the Secure Chat interface with room list, messages, notification panel, and server status.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#18263d"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient></defs>
  <rect width="1200" height="720" rx="24" fill="url(#bg)"/>
  <rect x="18" y="18" width="1164" height="684" rx="18" fill="#f8fafc"/>
  <rect x="18" y="18" width="1164" height="58" rx="18" fill="#111827"/><rect x="18" y="58" width="1164" height="18" fill="#111827"/>
  <circle cx="44" cy="47" r="6" fill="#fb7185"/><circle cx="64" cy="47" r="6" fill="#fbbf24"/><circle cx="84" cy="47" r="6" fill="#34d399"/>
  <text x="112" y="53" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#f8fafc">Secure Chat</text>
  <rect x="970" y="33" width="188" height="28" rx="14" fill="#14532d"/><circle cx="988" cy="47" r="5" fill="#4ade80"/><text x="1001" y="52" font-family="Arial,sans-serif" font-size="12" fill="#dcfce7">Illustrative preview</text>
  <rect x="18" y="76" width="245" height="626" fill="#eef2f7"/>
  <text x="42" y="117" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#64748b">WORKSPACE</text>
  <rect x="34" y="136" width="212" height="54" rx="12" fill="#dbeafe"/><circle cx="59" cy="163" r="15" fill="#2563eb"/><path d="M52 163h14M59 156v14" stroke="#fff" stroke-width="2" stroke-linecap="round"/><text x="83" y="159" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">General room</text><text x="83" y="177" font-family="Arial,sans-serif" font-size="11" fill="#475569">12 recent messages</text>
  <rect x="34" y="200" width="212" height="54" rx="12" fill="#fff"/><circle cx="59" cy="227" r="15" fill="#0f766e"/><text x="53" y="232" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">P</text><text x="83" y="223" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#334155">Private chats</text><text x="83" y="241" font-family="Arial,sans-serif" font-size="11" fill="#64748b">Messages and replies</text>
  <text x="42" y="293" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#64748b">SERVER STATUS</text>
  <rect x="34" y="309" width="212" height="110" rx="12" fill="#fff" stroke="#e2e8f0"/><circle cx="54" cy="334" r="5" fill="#22c55e"/><text x="68" y="339" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#334155">Connected</text><text x="48" y="366" font-family="Arial,sans-serif" font-size="12" fill="#64748b">Transport</text><text x="220" y="366" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#0f766e">WSS / TLS</text><text x="48" y="391" font-family="Arial,sans-serif" font-size="12" fill="#64748b">Session</text><text x="220" y="391" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#334155">Authenticated</text>
  <rect x="34" y="435" width="212" height="92" rx="12" fill="#fff" stroke="#e2e8f0"/><text x="48" y="461" font-family="Arial,sans-serif" font-size="12" fill="#64748b">Privacy</text><text x="48" y="484" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#334155">Diagnostics optional</text><text x="48" y="505" font-family="Arial,sans-serif" font-size="11" fill="#64748b">Permission-based sharing</text>
  <rect x="263" y="76" width="690" height="626" fill="#fff"/><text x="294" y="117" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0f172a">General room</text><text x="294" y="140" font-family="Arial,sans-serif" font-size="12" fill="#64748b">Example conversation · sample content only</text><line x1="283" y1="157" x2="934" y2="157" stroke="#e2e8f0"/>
  <circle cx="315" cy="194" r="17" fill="#7c3aed"/><text x="309" y="199" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">A</text><text x="342" y="190" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#334155">Alex</text><rect x="342" y="201" width="348" height="52" rx="12" fill="#f1f5f9"/><text x="358" y="222" font-family="Arial,sans-serif" font-size="13" fill="#334155">Welcome to the secure chat workspace.</text><text x="358" y="240" font-family="Arial,sans-serif" font-size="13" fill="#334155">Please use a strong, unique password.</text>
  <circle cx="315" cy="286" r="17" fill="#0f766e"/><text x="309" y="291" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">S</text><text x="342" y="282" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#334155">Sam · you</text><rect x="538" y="293" width="365" height="49" rx="12" fill="#dbeafe"/><text x="554" y="314" font-family="Arial,sans-serif" font-size="13" fill="#1e3a8a">Got it. I’ll keep credentials and tokens</text><text x="554" y="332" font-family="Arial,sans-serif" font-size="13" fill="#1e3a8a">out of messages and screenshots.</text>
  <rect x="294" y="369" width="610" height="1" fill="#e2e8f0"/><text x="294" y="395" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#64748b">MESSAGE TOOLS</text>
  <rect x="294" y="411" width="90" height="30" rx="8" fill="#eff6ff" stroke="#bfdbfe"/><text x="339" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#1d4ed8">↩ Reply</text><rect x="393" y="411" width="90" height="30" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="438" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155">⌕ Search</text><rect x="492" y="411" width="90" height="30" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="537" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155">Copy</text>
  <rect x="294" y="609" width="610" height="58" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><text x="314" y="634" font-family="Arial,sans-serif" font-size="13" fill="#94a3b8">Write a message…</text><rect x="812" y="620" width="75" height="34" rx="9" fill="url(#accent)"/><text x="849" y="642" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">Send</text>
  <rect x="953" y="76" width="229" height="626" fill="#f8fafc"/><text x="978" y="117" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#0f172a">Activity</text><text x="978" y="140" font-family="Arial,sans-serif" font-size="12" fill="#64748b">Notifications and summary</text>
  <rect x="972" y="160" width="190" height="94" rx="12" fill="#fff" stroke="#e2e8f0"/><circle cx="994" cy="184" r="7" fill="#2563eb"/><text x="1010" y="188" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#334155">Unread notification</text><text x="988" y="213" font-family="Arial,sans-serif" font-size="11" fill="#64748b">A teammate sent you a</text><text x="988" y="230" font-family="Arial,sans-serif" font-size="11" fill="#64748b">private message.</text>
  <rect x="972" y="267" width="190" height="120" rx="12" fill="#fff" stroke="#e2e8f0"/><text x="988" y="292" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#334155">Sample report</text><text x="988" y="318" font-family="Arial,sans-serif" font-size="11" fill="#64748b">Service</text><text x="1146" y="318" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#15803d">Healthy*</text><text x="988" y="343" font-family="Arial,sans-serif" font-size="11" fill="#64748b">Database</text><text x="1146" y="343" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#334155">SQLite</text><text x="988" y="368" font-family="Arial,sans-serif" font-size="11" fill="#64748b">*Illustrative only</text>
  <rect x="972" y="401" width="190" height="72" rx="12" fill="#fff" stroke="#e2e8f0"/><text x="988" y="426" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#334155">Admin tools</text><text x="988" y="447" font-family="Arial,sans-serif" font-size="11" fill="#64748b">Authenticated API routes</text><text x="988" y="462" font-family="Arial,sans-serif" font-size="11" fill="#64748b">No full web admin UI yet</text>
  <text x="600" y="688" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8">DESIGN MOCKUP — NOT A LIVE APPLICATION SCREENSHOT OR REAL SERVER REPORT</text>
</svg>