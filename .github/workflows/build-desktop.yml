name: Build desktop applications
on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'desktop/**'
      - 'package.json'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'desktop/**'
      - 'package.json'
      - '.github/workflows/build-desktop.yml'
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-installer
          - os: ubuntu-latest
            artifact: linux-packages
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run check
      - run: npm test
      - run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.msi
            release/*.AppImage
            release/*.deb
            release/*.rpm
          if-no-files-found: error
